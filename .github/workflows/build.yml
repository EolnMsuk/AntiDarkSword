name: Compile & Draft Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize and check release metadata
        id: version
        run: |
          python3 scripts/version.py sync
          python3 scripts/version.py check
          echo "version=$(python3 scripts/version.py print)" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [legacy, rootful, rootless, roothide, trollfools]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      THEOS: ${{ github.workspace }}/.build/toolchain
      ADS_SDK_DIR: ${{ github.workspace }}/.build/sdks
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Native Roothide modules, typed API, libraries and exact submodule pins.
      # Source review/provenance: docs/building.md. No rootless package conversion.
      - name: Checkout pinned Roothide-capable Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: 958fea4f779943505b15b93c88bb4db8d97b346d
          submodules: recursive
          path: .build/toolchain
      - name: Checkout pinned patched SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: 0222fd5413cf4b9af096f37b4621afa2688572f7
          path: .build/sdks
          sparse-checkout: ${{ matrix.target == 'legacy' && 'iPhoneOS14.5.sdk' || 'iPhoneOS16.5.sdk' }}
      - name: Prepare macOS packaging and signing tools
        run: |
          brew install ldid dpkg xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Build one isolated target
        env:
          ADS_TARGET: ${{ matrix.target }}
        run: |
          test "$(python3 scripts/version.py print)" = "$RELEASE_VERSION"
          bash scripts/build_target.sh "$ADS_TARGET"
      - name: Upload the verified product
        uses: actions/upload-artifact@v4
        with:
          name: AntiDarkSword-${{ matrix.target }}
          path: output/*
          if-no-files-found: error

  release:
    needs: [metadata, build]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AntiDarkSword-*
          merge-multiple: true
          path: output
      - name: Validate all five assets and compose draft notes
        run: |
          brew install dpkg
          test "$(python3 scripts/version.py print)" = "$VERSION"
          python3 scripts/collect_product.py verify-release
          python3 scripts/version.py notes > release-notes.md
          python3 scripts/release_notes.py >> release-notes.md
      - name: Create reviewable release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-b${{ github.run_number }}
          name: AntiDarkSword v${{ env.VERSION }}
          files: output/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          body_path: release-notes.md
